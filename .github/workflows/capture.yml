name: Data vault (daily capture)
on:
  schedule:
    - cron: "40 22 * * 1-5"   # 6:40 PM EDT / 5:40 PM EST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oracle-capture
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PORTFOLIO_HOLDINGS: ${{ secrets.PORTFOLIO_HOLDINGS }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      ORACLE_SYNC_TOKEN: ${{ secrets.ORACLE_SYNC_TOKEN }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_LIVE_CONFIRM: ${{ secrets.ALPACA_LIVE_CONFIRM }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_USER: ${{ secrets.HF_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/oracle-setup
        with:
          full: "false"
      - name: Run
        run: python -m app.cli capture
      - name: Save results
        if: always()
        run: ./scripts/commit.sh "data vault"
