name: Kronos diagnostic (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/oracle-setup
      - name: Run
        run: python tests/diag_kronos.py
      - name: Save results
        if: always()
        run: ./scripts/commit.sh "diagnostic"
