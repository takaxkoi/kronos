name: Monthly custom-model retrain
on:
  schedule:
    - cron: "0 9 2 * *"       # 2nd of each month
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oracle-retrain
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PORTFOLIO_HOLDINGS: ${{ secrets.PORTFOLIO_HOLDINGS }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_LIVE_CONFIRM: ${{ secrets.ALPACA_LIVE_CONFIRM }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_USER: ${{ secrets.HF_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/oracle-setup
        with:
          full: "true"
      - name: Run
        run: python -m app.cli retrain
      - name: Save results
        if: always()
        run: ./scripts/commit.sh "monthly retrain"
