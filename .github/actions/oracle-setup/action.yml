name: Oracle setup
description: Python + dependencies (+ Kronos model cache)
inputs:
  full:
    description: install PyTorch + model deps
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements-app.txt
    - name: Install light deps
      shell: bash
      run: pip install -r requirements-app.txt
    - name: Install PyTorch (CPU)
      if: inputs.full == 'true'
      shell: bash
      run: pip install torch --index-url https://download.pytorch.org/whl/cpu
    - name: Cache Kronos weights
      if: inputs.full == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hf-${{ hashFiles('app/config.yaml', 'app/custom_models.yaml') }}
        restore-keys: hf-
