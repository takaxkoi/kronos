<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oracle Dashboard</title>
<meta name="description" content="Kronos AI market forecasts: scores, ranges, trade plans and a live report card.">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oracle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141414'/%3E%3Cpath d='M14 44 L26 30 L34 37 L50 18' stroke='%23C6F432' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141414; --panel:#1E1E1E; --panel2:#262626; --line:#2E2E2E; --line2:#444444;
  --ink:#F2F2F2; --ink2:#D0D0D0; --muted:#A3A3A3; --gold:#C6F432; --gold2:#C6F432; --goldchart:#F2F2F2;
  --up:#C6F432; --dn:#FF7A59; --blue:#8AB4FF; --rose:#FF7A59; --warn:#FFD166;
  --r:20px; --mono:'Space Grotesk',system-ui,sans-serif; --serif:'Space Grotesk',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 'Space Grotesk',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{min-height:100vh}
a{color:var(--gold);text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 calc(14px + env(safe-area-inset-right,0px)) calc(80px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px))}

/* top bar: one sticky row; everything else lives in the menu */
header.top{position:sticky;top:0;z-index:30;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 0 8px}
.bar{display:flex;gap:8px;align-items:center}
.menubtn{flex:1;min-width:0;height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border:0;border-radius:26px;background:var(--panel);cursor:pointer;font-weight:700;font-size:17px;text-align:left}
.menubtn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menubtn svg{flex:none}
.menubtn[aria-expanded="true"]{background:var(--ink);color:var(--bg)}
.iconbtn{flex:none;width:52px;height:52px;border:0;border-radius:26px;background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconbtn:active,.menubtn:active{background:var(--panel2)}
.menu{position:absolute;left:-14px;right:-14px;top:100%;max-height:calc(100vh - 76px - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--bg);border-bottom:1px solid var(--line2);padding:6px 14px 20px;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.menu input{width:100%;height:52px;border:2px solid var(--line2);border-radius:26px;background:var(--panel);padding:0 18px;font-size:17px;font-weight:500}
.menu input:focus{outline:none;border-color:var(--gold)}
.menu h4{margin:18px 4px 8px;font-size:13px;font-weight:500;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mgrid button,.mres button{height:54px;border:0;border-radius:16px;background:var(--panel);padding:0 14px;text-align:left;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.mgrid button.on{background:var(--gold);color:#141414}
.mres{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.mres button small{color:var(--muted);font-weight:500;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mres button b{flex:none}
.status{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;padding:2px 4px 10px}
.status b{color:var(--ink);font-weight:700}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:16px}
nav button{height:44px;border:0;border-radius:22px;background:var(--panel);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
nav button.on{background:var(--ink);color:var(--bg)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-weight:700;font-size:12px;color:var(--ink);background:var(--panel)}
.btn{cursor:pointer;border:0;background:var(--panel2);border-radius:22px;padding:0 18px;min-height:44px;font-weight:700;font-size:14px}
.btn.gold{background:var(--gold);color:#141414}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.g4.keep2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--panel);border-radius:var(--r);padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--muted)}
.card h3 .r{display:block;color:var(--muted);margin-top:2px}
.brief .bl{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-size:16px;line-height:1.45;color:var(--ink)}
.brief .bl:first-child{border-top:0}
.brief .bl i{flex:0 0 8px;height:8px;border-radius:50%;background:#555;margin-top:8px}
.brief .bl i.up{background:var(--gold)}.brief .bl i.dn{background:#FF7A59}
.brief .bl.click{cursor:pointer}
.btn.more{margin-top:10px;width:100%;min-height:48px;border-radius:24px;border:0;background:var(--bg);color:var(--ink);font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit}
.lgx{padding:4px 0 14px;border-top:1px dashed var(--line)}.lgx p{font-size:14.5px;line-height:1.5;color:var(--ink2);margin:10px 0}
.sec-title{font-size:24px;font-weight:700;line-height:1.15;letter-spacing:-.02em;margin:28px 2px 12px;color:var(--ink)}
.sec-title small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px}
.hero{font-size:52px;font-weight:700;line-height:1;letter-spacing:-.04em;color:var(--ink)}
.hero.gold{color:var(--gold)}
.sub{color:var(--muted);font-size:13px}
.up{color:var(--up)}.dn{color:var(--dn)}.gold-t{color:var(--gold)}.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--panel2);color:var(--ink2);white-space:nowrap;display:inline-block}
.chip.g{background:var(--up);color:#141414}.chip.r{background:var(--dn);color:#141414}.chip.y{background:var(--ink);color:#141414}
.setup{cursor:pointer}
.setup:active{background:var(--panel2)}
.tk{font-size:20px;font-weight:700;letter-spacing:-.01em}
.nm{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--gold)}
.score small{font-size:12px;color:var(--muted);letter-spacing:0}
.meter{display:flex;gap:2px;flex-wrap:wrap;margin:10px 0 4px}
.meter i{width:7px;height:14px;border-radius:3px;background:var(--line2)}
.meter i.u{background:var(--up)}.meter i.d{background:var(--dn)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.kv div{background:var(--bg);border-radius:14px;padding:9px 10px;min-width:0}
.kv span{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.kv b{font-size:15px;font-weight:700;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:11px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}tr.click:active td{background:var(--panel2)}
.tbl{overflow-x:auto;margin:0 -6px;padding:0 6px;-webkit-overflow-scrolling:touch}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--panel);border-radius:var(--r)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#141414;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:700;line-height:1.5;white-space:nowrap;opacity:0;transition:opacity .08s;z-index:5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.seg{display:inline-flex;gap:4px;background:var(--bg);border-radius:24px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:0;background:none;min-height:42px;padding:0 14px;border-radius:21px;font-size:13.5px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--gold);color:#141414}
.card .seg{background:var(--bg)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:4px}
.heat div{border-radius:12px;padding:8px 7px;font-size:12px;font-weight:700;cursor:pointer;min-height:48px;color:#F2F2F2}
.heat div small{display:block;font-weight:500;opacity:.9;margin-top:2px}
.hbar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:14px;padding:6px 0}
.hbar .track{position:relative;height:14px}
.hbar .track .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line2)}
.hbar .track b{position:absolute;top:0;height:14px;border-radius:5px}
@media(max-width:640px){.hbar{grid-template-columns:104px 1fr 62px}}
.gauge{height:16px;border-radius:99px;background:var(--dn);overflow:hidden;position:relative;margin:12px 0 6px}
.gauge b{position:absolute;inset:0 auto 0 0;background:var(--up);border-right:3px solid var(--panel)}
.news a{display:block;padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink);font-size:14.5px}
.news a small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.disc{margin-top:28px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}
input.f{background:var(--bg);border:2px solid var(--line2);border-radius:14px;padding:10px 12px;width:100%;font-size:15px}
input.f:focus{outline:none;border-color:var(--gold)}
.steps li{margin:0 0 14px;color:var(--ink2)}
.steps li b{color:var(--ink)}
code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--panel2);color:var(--gold);padding:2px 6px;border-radius:6px}
.back{cursor:pointer;color:var(--ink);font-weight:700;font-size:14px;margin:0 0 12px;display:inline-flex;align-items:center;height:44px;padding:0 16px;border-radius:22px;background:var(--panel)}
.loading{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px}
.warnbox{background:var(--warn);color:#141414;border-radius:var(--r);padding:14px 16px;font-size:14px;font-weight:500}
.warnbox b{font-weight:700}

/* live news */
.story{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.story:first-child{border-top:0}
.story .side{flex:none;width:6px;border-radius:3px;background:var(--line2)}
.story.bull .side{background:var(--up)}.story.bear .side{background:var(--dn)}
.story a.t{display:block;color:var(--ink);font-size:16px;font-weight:700;line-height:1.3}
.story .meta{color:var(--muted);font-size:12.5px;margin:4px 0 6px}
.story.fresh a.t::after{content:"new";margin-left:8px;font-size:11px;background:var(--ink);color:#141414;border-radius:99px;padding:2px 7px;vertical-align:middle}
.tkchip{border:0;cursor:pointer;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--panel2);color:var(--ink);min-height:30px}
.tkchip.bull{background:var(--up);color:#141414}.tkchip.bear{background:var(--dn);color:#141414}
.hotrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hotrow::-webkit-scrollbar{display:none}
.hotrow button{flex:none;min-height:44px;padding:0 14px}
.hotrow button.on{outline:2px solid var(--ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.ohlc{font-size:13px;color:var(--ink2);min-height:20px;margin-bottom:4px}
.ohlc b{color:var(--ink)}
/* today */
.lede{padding:6px 4px 4px}
.lede h1{margin:0;font-size:36px;line-height:1.06;letter-spacing:-.03em;font-weight:700}
.lede p{margin:12px 0 0;font-size:17px;line-height:1.45;color:var(--ink2)}
.cmp{display:grid;grid-template-columns:1.5fr .8fr .9fr;gap:8px;align-items:center;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.cmp.head{border-top:0;padding:0 0 8px;font-size:12.5px;color:var(--muted);cursor:default}
.cmp>span{text-align:right;font-size:17px;font-weight:700}
.cmp>span:first-child{text-align:left;min-width:0}
.cmp b{display:block;font-size:19px}
.cmp small{display:block;font-size:12.5px;font-weight:500;color:var(--muted);line-height:1.35;margin-top:2px}
.cmp .big,.idea .big{font-size:24px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.spot{background:var(--gold);color:#141414;border-radius:28px;padding:22px;cursor:pointer}
.spot.old{background:var(--panel);color:var(--ink)}
.spot .sub2{font-size:14px;font-weight:500}
.spot .tick{font-size:84px;font-weight:700;letter-spacing:-.05em;line-height:.95;margin-top:14px}
.spot .nm2{font-size:18px;font-weight:500;margin-top:4px}
.spot .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 12px}
.spot .two span{display:block;font-size:14px;font-weight:500}
.spot .two b{font-size:38px;letter-spacing:-.03em;line-height:1.1}
.spot p{margin:0;font-size:16px;line-height:1.45;font-weight:500}
.idea{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-height:56px}
.idea:first-of-type{border-top:0}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs>div{border-radius:24px;padding:18px;color:#141414;display:flex;flex-direction:column;gap:14px}
.vs .bull{background:var(--up)}.vs .bear{background:var(--dn)}
.vs h4{margin:0;font-size:20px;font-weight:700}
.vs b{display:block;font-size:30px;letter-spacing:-.03em;line-height:1}
.vs span{font-size:14px;font-weight:500;line-height:1.3;display:block;margin-top:2px}
.wl{display:grid;grid-template-columns:1fr auto 98px;gap:12px;align-items:center;min-height:56px;border-top:1px solid var(--line);cursor:pointer}
.wl:first-child{border-top:0}
.wl b{font-size:19px}.wl span{font-size:16px;color:var(--ink2)}
.wl i{font-style:normal;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:15.5px;font-weight:700;color:#141414}
.wl i.u{background:var(--up)}.wl i.d{background:var(--dn)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="bar">
      <button class="menubtn" id="menuBtn" aria-expanded="false" aria-controls="menu"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span id="menuLabel">Today</span><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 5l5 5 5-5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="iconbtn" id="searchBtn" aria-label="Search a ticker or page"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="2.2" fill="none"/><path d="M14 14l4 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      <button class="iconbtn" id="reload" aria-label="Refresh data"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-2-4.7M16.5 3v3.5H13" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="menu" id="menu" hidden>
      <input id="cmd" type="search" placeholder="Type a ticker or a page name" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-label="Search a ticker or page">
      <div id="menuBody"></div>
      <button class="btn" id="signout" style="margin-top:18px;width:100%">Sign out</button>
    </div>
  </header>
  <div class="status"><span id="stamp">loading</span><span id="moodPill"></span><span id="hitPill"></span></div>
  <nav id="nav" aria-label="Shortcuts"></nav>
  <main id="view"><div class="loading">Loading forecasts</div></main>
  <p class="disc">Kronos Oracle shows machine-learning forecasts of price patterns. They are probabilities, not promises — the report card shows how often they have actually been right. Not financial advice.</p>
</div>

<script>
const SB_URL = 'https://stzeugbijanjwroibtmx.supabase.co';
const SB_KEY = 'sb_publishable_IsJeraZpjoUXbeO8Lr-F_g_14h7UoUm';
const sb = window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: true, autoRefreshToken: true}});
const DEFAULT_SRC = 'supabase';
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let SRC = store.get('oracle_src', DEFAULT_SRC);
const cache = {};
async function get(path){
  if (cache[path] !== undefined) return cache[path];
  try {
    const { data, error } = await sb.from('oracle_docs').select('body').eq('path', path).maybeSingle();
    cache[path] = error || !data ? null : data.body;
  } catch(e){ cache[path] = null; }
  return cache[path];
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (x, d=1) => x == null || isNaN(x) ? '—' : (x > 0 ? '+' : '') + (x*100).toFixed(d) + '%';
const pct0 = x => x == null || isNaN(x) ? '—' : Math.round(x*100) + '%';
const px = x => x == null || isNaN(x) ? '—' : Math.abs(x) >= 1000 ? x.toLocaleString(undefined,{maximumFractionDigits:0}) : Math.abs(x) >= 1 ? x.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) : x.toPrecision(4);
const money = x => x == null ? '—' : '$' + Math.round(x).toLocaleString();
const arrow = d => d === 'up' ? '<span class="up">▲</span>' : '<span class="dn">▼</span>';
const cls = x => x > 0 ? 'up' : x < 0 ? 'dn' : '';
const dateS = s => s ? new Date(/^\d{4}-\d\d-\d\d$/.test(s) ? s + 'T12:00:00' : s).toLocaleDateString(undefined,{month:'short',day:'numeric'}) : '—';
const safe = t => t.replace('^','_').replace(/=/g,'_').replace(/\//g,'_');
const ago = s => { if(!s) return '—'; const m = (Date.now() - new Date(s))/60000; return m < 60 ? Math.round(m)+'m ago' : m < 2880 ? Math.round(m/60)+'h ago' : Math.round(m/1440)+'d ago'; };
const FLAG = {breakout:['🚀 breakout','g'],breakdown:['🕳 breakdown','r'],reversal_up:['↩ bounce','g'],reversal_down:['↪ rollover','r'],
  momentum_up:['📈 momentum','g'],momentum_down:['📉 momentum','r'],gap_up:['⬆ gap up','g'],gap_down:['⬇ gap down','r'],
  volume_surge:['🔊 volume surge','y'],volatility:['⚡ big swings','y'],earnings:['📅 earnings · paused','y'],illiquid:['🧊 thin volume','y'],leveraged:['⚠ leveraged','y']};
const chips = f => (f||[]).map(x => `<span class="chip ${FLAG[x]?.[1]||''}">${FLAG[x]?.[0]||esc(x)}</span>`).join('');
const meter = a => { const n = a.samples||0, up = Math.round((a.p_up||0)*n); let h=''; for(let i=0;i<n;i++) h += `<i class="${i<up?'u':'d'}"></i>`; return `<div class="meter" title="${up} of ${n} simulated futures go up">${h}</div>`; };

let LATEST = null, REPORT = null;
const MENU = [
  ['Markets', [['brief','Daily brief'],['today','Today'],['crypto','Crypto'],['spx','S&P 500'],['fear','Fear and greed'],['calendar','Calendar'],['live','Live prices'],['market','Market map'],['scanner','S&P 500 scan'],['mscan','Market scan'],['other','Crypto, FX, gold']]],
  ['Stocks', [['term','Terminal'],['watch','Watchlist'],['earn','Earnings moves'],['insiders','Insider trades'],['research','AI research'],['lenses','Lenses']]],
  ['News and crowd', [['livenews','Live news'],['news','News mood'],['wsb','WallStreetBets']]],
  ['Labs', [['factor','Strategy test'],['edge','Edge Lab'],['filings','Filings Lab'],['perf','Performance'],['report','Report card'],['backtest','Backtest Lab']]],
  ['Account', [['league','Strategy league'],['paper','Paper trading'],['journal','Journal'],['setup','Setup']]],
];
const TABS = MENU.flatMap(g => g[1]);
const QUICK = [['brief','Brief'],['today','Today'],['spx','S&P 500'],['crypto','Crypto'],['livenews','News']];
let LIVE_T = null;
function menuOpen(open, focus){
  const m = $('#menu'), b = $('#menuBtn');
  m.hidden = !open; b.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open){ $('#cmd').value = ''; menuDraw(''); m.scrollTop = 0; if (focus) $('#cmd').focus(); }
}
let STOCKS = null;
async function menuDraw(q){
  const active = decodeURIComponent(location.hash.replace(/^#\/?/, '')) || 'brief';
  q = q.trim();
  if (!q){
    $('#menuBody').innerHTML = MENU.map(([g, items]) => `<h4>${g}</h4><div class="mgrid">${items.map(([k,l]) => `<button data-go="${k}" class="${k===active?'on':''}">${l}</button>`).join('')}</div>`).join('');
  } else {
    if (STOCKS === null){ const I = await get('p/index.json'); STOCKS = (I && I.stocks) || []; }
    const Q = q.toUpperCase(), pages = TABS.filter(([k,l]) => l.toUpperCase().includes(Q));
    const st = STOCKS.filter(s => s.t.startsWith(Q) || (s.i||'').toUpperCase().includes(Q)).sort((a,b) => (b.t===Q)-(a.t===Q) || (a.t.length-b.t.length) || ((b.c||0)-(a.c||0))).slice(0, 12);
    const direct = /^[A-Z.\-^=]{1,10}$/.test(Q) && !st.some(s => s.t === Q) ? `<button data-go="t/${esc(Q)}"><span><b>${esc(Q)}</b> <small>open this ticker</small></span></button>` : '';
    $('#menuBody').innerHTML = `<div class="mres">${pages.map(([k,l]) => `<button data-go="${k}"><span>${l}</span><small>page</small></button>`).join('')}${st.map(s => `<button data-go="t/${esc(s.t)}"><span style="min-width:0;display:flex;gap:10px;align-items:baseline"><b>${esc(s.t)}</b><small>${esc(s.i||s.s||'')}</small></span><b class="${cls(s.d)}">${s.p!=null?px(s.p):''}</b></button>`).join('')}${direct}</div>` + (!pages.length && !st.length && !direct ? '<div class="empty" style="margin-top:10px">Nothing matches. Try a ticker like NVDA or a page like News.</div>' : '');
  }
  $('#menuBody').querySelectorAll('[data-go]').forEach(b => b.onclick = () => { menuOpen(false); location.hash = b.dataset.go; });
}
function navInit(){
  $('#menuBtn').onclick = () => menuOpen($('#menu').hidden);
  $('#searchBtn').onclick = () => menuOpen(true, true);
  $('#cmd').oninput = e => menuDraw(e.target.value);
  $('#cmd').onkeydown = e => { if (e.key === 'Enter'){ const b = $('#menuBody').querySelector('[data-go]'); if (b) b.click(); } if (e.key === 'Escape') menuOpen(false); };
  document.addEventListener('click', e => { if (!$('#menu').hidden && !e.target.closest('header.top')) menuOpen(false); });
}
function navRender(active){
  const t = TABS.find(([k]) => k === active);
  $('#menuLabel').textContent = t ? t[1] : (active || 'Menu');
  $('#nav').innerHTML = QUICK.map(([k,l]) => `<button class="${k===active?'on':''}" data-k="${k}">${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => { location.hash = b.dataset.k; });
  if (LIVE_T){ clearInterval(LIVE_T); LIVE_T = null; }
}
function autoRefresh(key, paths, draw){
  if (LIVE_T) clearInterval(LIVE_T);
  LIVE_T = setInterval(() => { if ((decodeURIComponent(location.hash.replace(/^#\/?/, '')) || 'brief') !== key || document.hidden) return; paths.forEach(p => delete cache[p]); draw(true); }, 60000);
}

function setupCard(a){
  const pl = a.plan || {};
  return `<div class="card setup" data-t="${esc(a.ticker)}">
    <div class="row"><div style="min-width:0"><div class="tk">${esc(a.ticker)} ${arrow(a.direction)}</div><div class="nm">${esc(a.name||a.sector||'')}</div></div>
    <div style="text-align:right"><div class="score">${a.score}<small>/100</small></div><div class="mono ${cls(a.median_return)}" style="font-size:13px">${pct(a.median_return)}</div></div></div>
    <div class="sub" style="margin-top:8px">${planSentence(a)} ${conf(a).k} of ${conf(a).n} simulated futures agree.</div>
    <div class="kv"><div><span>Entry</span><b>${px(pl.entry_low)}–${px(pl.entry_high)}</b></div><div><span>Stop</span><b class="dn">${px(pl.stop)}</b></div><div><span>Target</span><b class="up">${px(pl.target)}</b></div></div>
    <div class="chips" style="margin-top:10px">${chips(a.flags)}</div></div>`;
}
function bindSetups(root){ (root||document).querySelectorAll('[data-t]').forEach(el => el.onclick = () => { location.hash = 't/' + el.dataset.t; }); }

function rowsTable(list, cols){
  if (!list || !list.length) return '<div class="empty">Nothing here yet.</div>';
  return `<div class="tbl"><table><thead><tr>${cols.map(c=>`<th class="${c[2]||''}">${c[0]}</th>`).join('')}</tr></thead><tbody>${
    list.map(a => `<tr class="click" data-t="${esc(a.ticker)}">${cols.map(c=>`<td class="${c[2]||''}">${c[1](a)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const STD_COLS = [
  ['Ticker', a => `<b>${esc(a.ticker)}</b> <span class="muted" style="font-size:11.5px">${esc((a.name||'').slice(0,22))}</span>`],
  ['Call', a => `${arrow(a.direction)} <span class="mono ${cls(a.median_return)}">${pct(a.median_return)}</span>`, 'n'],
  ['Agree', a => `${Math.round(a.agreement*a.samples)}/${a.samples}`, 'n'],
  ['Score', a => `<span class="gold-t">${a.score}</span>`, 'n'],
  ['Last', a => px(a.last_close), 'n'],
  ['Week range', a => a.ranges ? `${px(a.ranges.week.low)} – ${px(a.ranges.week.high)}` : '—', 'n'],
  ['Signals', a => chips(a.flags)]
];

/* ───────── TODAY ───────── */
const conf = a => { const n = a.samples || 0, k = a.agree_count != null ? a.agree_count : Math.round((a.agreement||0)*n), r = n ? k/n : 0;
  return {k, n, word: r >= 0.9 ? 'very confident' : r >= 0.75 ? 'confident' : r >= 0.6 ? 'leaning that way' : 'close to a coin flip'}; };
const signed = (v, d) => { if (v == null) return '—'; const t = Math.abs(v*100).toFixed(d == null ? 1 : d); return (+t === 0 ? '' : v >= 0 ? '+' : '−') + t + '%'; };
const daysOld = s => s ? (Date.now() - new Date(s).getTime()) / 864e5 : 99;
const niceDate = s => s ? new Date(s).toLocaleDateString(undefined, {month:'short', day:'numeric'}) : '';
function planSentence(a){
  const p = a.plan || {}; if (!p.entry_low) return '';
  const act = p.side === 'short' ? ['Short between', 'Cover if it rises to', 'Take profit at'] : ['Buy between', 'Sell if it falls to', 'Take profit at'];
  return `${act[0]} ${px(p.entry_low)} and ${px(p.entry_high)}. ${act[1]} ${px(p.stop)}. ${act[2]} ${px(p.target)}.${p.rr != null ? ` That risks $1 to make $${p.rr.toFixed(2)}.` : ''}`;
}
function ideaRow(a){
  const c = conf(a);
  return `<div class="idea setup" data-t="${esc(a.ticker)}"><div style="min-width:0"><div class="tk">${esc(a.ticker)} <span class="muted" style="font-size:13px;font-weight:500">${esc(a.name||a.sector||'')}</span></div><div class="sub">${c.k} of ${c.n} simulated futures agree, score ${a.score}</div></div><div class="big ${cls(a.median_return)}">${signed(a.median_return)}</div></div>`;
}
async function viewToday(){
  const L = LATEST;
  if (!L) return setupNeeded();
  const [Q, N, SC] = await Promise.all([get('quotes.json'), get('livenews.json'), get('scanner.json')]);
  // the overnight stock scan can be newer than the daily summary; use whichever ideas are fresher
  const fresh = SC && (SC.top_long||[]).length && (!(L.top_long||[]).length || new Date((SC.top_long[0]||{}).asof||0) > new Date((L.top_long[0]||{}).asof||0));
  const TL = fresh ? SC.top_long : (L.top_long||[]), TS = fresh ? (SC.top_short||[]) : (L.top_short||[]);
  const m = L.mood || {}, v = L.vix || {}, I = L.indices || [], H = L.horizon || 5;
  const q = Object.fromEntries(((Q && Q.rows) || []).map(r => [r.ticker, r]));
  const upI = I.filter(a => (a.median_return||0) > 0), best = I.slice().sort((a,b) => (b.median_return||0) - (a.median_return||0))[0], worst = I.slice().sort((a,b) => (a.median_return||0) - (b.median_return||0))[0];
  const moodWord = m.label === 'RISK-ON' ? 'Markets look strong.' : m.label === 'RISK-OFF' ? 'Markets look weak.' : 'Markets look neutral.';
  const second = best && (best.median_return||0) > 0.004 ? `${esc(best.name || best.ticker)} has the strongest forecast.` : upI.length ? 'No index stands out.' : 'Every index is forecast lower.';
  let h = `<div class="lede"><h1>${moodWord} ${second}</h1><p>${pct0(m.pct_up)} of ${m.n||0} stocks are forecast to rise over the next ${H} trading days.${best ? ` ${esc(best.name||best.ticker)} is forecast ${signed(best.median_return)}` : ''}${worst && worst !== best ? `, ${esc(worst.name||worst.ticker)} ${signed(worst.median_return)}.` : '.'} These forecasts have been right ${L.report?.hit_rate != null ? pct0(L.report.hit_rate) : 'an unknown share'} of the time, so treat them as a lean, not a promise.</p></div>`;

  // indexes: today vs forecast, with confidence in words
  h += `<div class="sec-title">The four indexes<small>What happened today, and the forecast for the next ${H} trading days</small></div><div class="card"><div class="cmp head"><span></span><span>Today</span><span>Next ${H} days</span></div>${I.map(a => { const c = conf(a), t = q[a.ticker];
    return `<div class="cmp setup" data-t="${esc(a.ticker)}"><span><b>${esc(a.name||a.ticker)}</b><small>${esc(a.ticker)}, ${c.word}: ${c.k} of ${c.n} simulated futures agree</small></span><span class="${t ? cls(t.change_pct) : 'muted'}">${t && t.change_pct != null ? signed(t.change_pct/100, 2) : '—'}</span><span class="big ${cls(a.median_return)}">${signed(a.median_return)}</span></div>`; }).join('')}
    ${v.level != null ? `<div class="cmp"><span><b>Fear gauge</b><small>VIX. Above 20 means investors are nervous; ${v.direction==='up'?'it is forecast to rise':'it is forecast to ease'}</small></span><span>${px(v.level)}</span><span class="big ${v.median_return > 0 ? 'dn' : 'up'}">${signed(v.median_return)}</span></div>` : ''}</div>`;

  // best idea
  const top = TL[0], stale = top && daysOld(top.asof) > 5;
  h += `<div class="sec-title">Best trade idea<small>The highest-scoring stock where the possible gain is at least twice the possible loss</small></div>`;
  if (!top) h += '<div class="empty">No stock qualifies today. That is normal on mixed days.</div>';
  else { const c = conf(top);
    h += `<div class="spot setup ${stale ? 'old' : ''}" data-t="${esc(top.ticker)}"><div class="sub2">${stale ? `From the scan on ${niceDate(top.asof)}. It is out of date; a new scan runs overnight.` : `From the scan on ${niceDate(top.asof)}`}</div><div class="tick">${esc(top.ticker)}</div><div class="nm2">${esc(top.name||top.sector||'')}</div>
      <div class="two"><div><span>Forecast, ${H} days</span><b>${signed(top.median_return)}</b></div><div><span>Score out of 100</span><b>${top.score}</b></div></div>
      <p>${planSentence(top)} ${c.k} of ${c.n} simulated futures agree.</p></div>`;
    const more = TL.slice(1, 5), shorts = [];  // the app no longer calls single stocks down (see Report card)
    if (more.length) h += `<div class="card" style="margin-top:10px"><h3>Next best ideas to buy</h3>${more.map(ideaRow).join('')}</div>`;
    if (shorts.length) h += `<div class="card" style="margin-top:10px"><h3>Stocks forecast to fall</h3>${shorts.map(ideaRow).join('')}</div>`;
  }

  // bulls vs bears
  const nb = N?.counts?.bull, nr = N?.counts?.bear;
  const bulls = [[upI.length + ' of ' + I.length, 'indexes forecast up'], [pct0(m.pct_up), 'of stocks forecast up'], [m.breakouts != null ? m.breakouts : null, 'stocks breaking out to new highs'], [nb != null ? nb : null, 'bullish news stories']].filter(x => x[0] != null);
  const bears = [[(I.length - upI.length) + ' of ' + I.length, 'indexes forecast down'], [pct0(1 - (m.pct_up||0)), 'of stocks forecast down'], [m.breakdowns != null ? m.breakdowns : null, 'stocks breaking down to new lows'], [nr != null ? nr : null, 'bearish news stories']].filter(x => x[0] != null);
  h += `<div class="sec-title">Bulls against bears<small>The evidence on each side, counted</small></div><div class="vs"><div class="bull"><h4>For the bulls</h4>${bulls.map(x => `<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div><div class="bear"><h4>For the bears</h4>${bears.map(x => `<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></div>`;

  // your stocks today
  const W = (L.watchlist || []).map(a => a.ticker), rows = W.map(t => q[t]).filter(r => r && r.change_pct != null).sort((a,b) => b.change_pct - a.change_pct);
  if (rows.length){ const ups = rows.filter(r => r.change_pct >= 0).length;
    h += `<div class="sec-title">Your stocks today<small>${ups} up, ${rows.length - ups} down. Prices updated ${ago(Q.generated)}</small></div><div class="card">${rows.map(r => `<div class="wl setup" data-t="${esc(r.ticker)}"><b>${esc(r.ticker)}</b><span>${px(r.price)}</span><i class="${r.change_pct >= 0 ? 'u' : 'd'}">${signed(r.change_pct/100, 2)}</i></div>`).join('')}</div>`; }

  // in the news
  if (N && (N.hot||[]).length) h += `<div class="sec-title">In the news<small>Companies with the most stories, and which way the coverage leans</small></div><div class="card">${N.hot.slice(0,5).map(x => `<div class="idea setup" data-t="${esc(x.t)}"><div><div class="tk">${esc(x.t)}</div><div class="sub">${x.n} stories: ${x.bull||0} bullish, ${x.bear||0} bearish</div></div><div class="big ${x.bull > x.bear ? 'up' : x.bear > x.bull ? 'dn' : ''}" style="font-size:17px">${x.bull > x.bear ? 'mostly bullish' : x.bear > x.bull ? 'mostly bearish' : 'mixed'}</div></div>`).join('')}<button class="btn" style="width:100%;margin-top:12px" onclick="location.hash='livenews'">Open live news</button></div>`;

  // scoreboard
  const P = L.paper, R = L.report || {};
  h += `<div class="sec-title">Is the app any good?<small>Every forecast is graded once its ${H} days are up</small></div><div class="grid g2">
    <div class="card"><h3>Forecasts that were right</h3><div class="hero">${R.hit_rate != null ? pct0(R.hit_rate) : '—'}</div><div class="sub" style="margin-top:6px">${R.n ? `Out of ${R.n.toLocaleString()} graded calls. A coin flip scores 50%, so this is a small edge at best.` : `${R.pending||0} calls are waiting to be graded.`}</div></div>
    <div class="card"><h3>Practice account against the market</h3>${P ? `<div class="hero ${cls(P.return - P.spy_return)}">${signed(P.return - P.spy_return)}</div><div class="sub" style="margin-top:6px">The practice account is ${signed(P.return)} and the S&P 500 is ${signed(P.spy_return)} over the same period. No real money is involved.</div>` : '<div class="sub">Starts after the first scan.</div>'}</div></div>`;

  const S = L.signals || {};
  const sigBlock = (k, title, why) => (S[k]||[]).length ? `<div class="card"><h3>${title} <span class="r">${why}</span></h3>${(S[k]||[]).slice(0,6).map(ideaRow).join('')}</div>` : '';
  const blocks = [['breakout','Breakouts','Closed above a 20-day high and forecast to keep going'],['breakdown','Breakdowns','Closed below a 20-day low and forecast to keep falling'],['reversal_up','Bounce candidates','Beaten down, forecast to turn up'],['reversal_down','Rollover risk','Run up, forecast to turn down'],['momentum_up','Momentum','Already rising and forecast to continue'],['volume_surge','Volume surges','Trading far more than usual'],['volatility','Big swings ahead','Forecast to move much more than normal']].map(x => sigBlock(...x)).join('');
  if (blocks) h += `<div class="sec-title">Signals<small>Stocks grouped by what the chart and the forecast say together</small></div><div class="grid g3">${blocks}</div>`;
  if ((L.earnings_paused||[]).length) h += `<div class="sec-title">Paused for earnings</div><div class="warnbox">Charts cannot see earnings surprises, so forecasts for these are switched off until after the report: ${L.earnings_paused.map(a=>`<b>${esc(a.ticker)}</b> (${esc(a.earnings)})`).join(', ')}</div>`;
  if (L.portfolio) { const F = L.portfolio;
    h += `<div class="sec-title">Your portfolio<small>Dollar amounts stay private and go to Telegram only</small></div><div class="grid g2">
      <div class="card"><h3>Forecast for the next ${H} days</h3><div class="hero ${cls(F.median_return)}">${signed(F.median_return)}</div><div class="sub">${pct0(F.p_down)} chance of a down week</div>
      ${F.hedge?`<div class="warnbox" style="margin-top:12px">A hedge is suggested: your holdings move ${F.hedge.beta.toFixed(2)} times as much as ${esc(F.hedge.index)}. Consider ${esc(F.hedge.inverse_etf)} or ${esc(F.hedge.index)} puts. Details are in Telegram.</div>`:''}</div>
      <div class="card"><h3>By holding</h3>${F.holdings.map(x=>`<div class="wl"><b>${esc(x.ticker)}</b><span>${pct0(x.weight)} of portfolio</span><i class="${x.ret >= 0 ? 'u' : 'd'}">${signed(x.ret)}</i></div>`).join('')}</div></div>`; }
  $('#view').innerHTML = h; bindSetups($('#view'));
}

function divBar(v, maxAbs){
  const w = Math.min(Math.abs(v||0)/maxAbs, 1) * 50;
  const pos = (v||0) >= 0;
  return `<div class="track"><div class="mid"></div><b style="${pos?`left:50%`:`left:${50-w}%`};width:${w}%;background:${pos?'var(--up)':'var(--dn)'}"></b></div>`;
}

function heatColor(r){
  const t = Math.min(Math.abs(r)/0.05, 1);
  const a = 0.18 + 0.72*t;
  return r >= 0 ? `rgba(198,244,50,${a})` : `rgba(255,122,89,${a})`;
}
function heatmapHTML(hm){
  if (!hm || !hm.length) return '<div class="empty">Heatmap appears after the S&P 500 scan runs.</div>';
  const by = {}; hm.forEach(x => (by[x.s] = by[x.s] || []).push(x));
  return Object.entries(by).sort((a,b)=>b[1].length-a[1].length).map(([s, xs]) => `<div style="margin-bottom:14px"><div class="sub mono" style="margin-bottom:6px;letter-spacing:.06em">${esc(s.toUpperCase())} · ${xs.length}</div>
    <div class="heat">${xs.sort((a,b)=>b.r-a.r).map(x=>`<div data-t="${esc(x.t)}" style="background:${heatColor(x.r)}" title="${esc(x.t)} ${pct(x.r)} · score ${x.sc}">${esc(x.t)}<small>${x.r>=0?'▲':'▼'} ${pct(x.r)}</small></div>`).join('')}</div></div>`).join('')
    + `<div class="legend"><span><i style="background:var(--dn)"></i>predicted down</span><span><i style="background:var(--up)"></i>predicted up</span><span>stronger color = bigger move (±5%+)</span></div>`;
}
async function viewMarket(){
  const L = LATEST; if (!L) return setupNeeded();
  const sec = L.sectors || [];
  const mx = Math.max(0.01, ...sec.map(s=>Math.abs(s.median_return)));
  let h = `<div class="sec-title">Sector rotation <small>which sectors Kronos expects to lead next week</small></div>
    <div class="card">${sec.map((s,i)=>`<div class="hbar"><span><b class="mono">${i+1}.</b> ${esc(s.name)} <span class="muted mono" style="font-size:11px">${esc(s.etf)}</span></span>${divBar(s.median_return, mx)}<span class="mono ${cls(s.median_return)}" style="text-align:right">${s.median_return>=0?'▲':'▼'} ${pct(s.median_return)}</span></div>`).join('') || '<div class="empty">No sector data.</div>'}</div>`;

/* ───────── FORECAST CHART (SVG candles + bands + hover) ───────── */
function forecastChart(ch, a, opts={}){
  const W = Math.max(340, Math.min(900, (window.innerWidth||900) - 64)), H = opts.h || (W < 600 ? 330 : 380), padL = 8, padR = 64, padT = 14, padB = 26;
  const hist = ch.history.slice(-(opts.bars||(W < 600 ? 40 : 70)));
  const fut = ch.future, med = ch.median, B = ch.bands;
  const nH = hist.length, nF = fut.length, N = nH + nF;
  let lo = Infinity, hi = -Infinity;
  hist.forEach(r => { lo = Math.min(lo, r[3]); hi = Math.max(hi, r[2]); });
  B['10'].forEach(v => lo = Math.min(lo, v)); B['90'].forEach(v => hi = Math.max(hi, v));
  med.forEach(r => { lo = Math.min(lo, r[2]); hi = Math.max(hi, r[1]); });
  const pl = a.plan; if (pl && pl.valid && opts.plan !== false){ [pl.stop, pl.target].forEach(v => { lo = Math.min(lo, v); hi = Math.max(hi, v); }); }
  const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  const xw = (W - padL - padR) / N, cx = i => padL + xw * (i + 0.5), y = v => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo));
  const bw = Math.max(2, xw * 0.62);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(a.ticker)} forecast chart">`;
  for (let k = 0; k <= 4; k++){ const v = lo + (hi - lo) * k / 4; s += `<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="#2E2E2E" stroke-width="1"/><text x="${W-padR+6}" y="${y(v)+4}" fill="#A3A3A3" font-size="11" font-family="Space Grotesk, sans-serif">${px(v)}</text>`; }
  const x0 = padL + xw * nH;
  s += `<rect x="${x0}" y="${padT}" width="${W-padR-x0}" height="${H-padT-padB}" fill="rgba(198,244,50,.04)"/><line x1="${x0}" x2="${x0}" y1="${padT}" y2="${H-padB}" stroke="#444444" stroke-dasharray="3 3"/>`;
  s += `<text x="${x0+6}" y="${H-padB-8}" fill="#C6F432" font-size="11" font-family="Space Grotesk, sans-serif">forecast</text>`;
  const lastC = hist[nH-1][4];
  const area = (a1, a2, fill) => { let p = `M${cx(nH-1)},${y(lastC)} `; a2.forEach((v,i)=> p += `L${cx(nH+i)},${y(v)} `); for (let i = a1.length-1; i >= 0; i--) p += `L${cx(nH+i)},${y(a1[i])} `; return `<path d="${p}Z" fill="${fill}"/>`; };
  s += area(B['10'], B['90'], 'rgba(173,138,54,.13)') + area(B['25'], B['75'], 'rgba(173,138,54,.22)');
  (ch.paths||[]).forEach(p => { s += `<polyline points="${[ [nH-1,lastC], ...p.map((v,i)=>[nH+i,v]) ].map(([i,v])=>`${cx(i)},${y(v)}`).join(' ')}" fill="none" stroke="rgba(217,184,101,.22)" stroke-width="1"/>`; });
  hist.forEach((r, i) => { const [ , o, h, l, c] = r, col = c >= o ? '#C6F432' : '#FF7A59';
    s += `<line x1="${cx(i)}" x2="${cx(i)}" y1="${y(h)}" y2="${y(l)}" stroke="${col}" stroke-width="1"/><rect x="${cx(i)-bw/2}" y="${y(Math.max(o,c))}" width="${bw}" height="${Math.max(1, Math.abs(y(o)-y(c)))}" fill="${col}" rx="1"/>`; });
  med.forEach((r, i) => { const [o, h, l, c] = r, j = nH + i;
    s += `<line x1="${cx(j)}" x2="${cx(j)}" y1="${y(h)}" y2="${y(l)}" stroke="#C6F432" stroke-width="1.2"/><rect x="${cx(j)-bw/2}" y="${y(Math.max(o,c))}" width="${bw}" height="${Math.max(1.5, Math.abs(y(o)-y(c)))}" fill="${c>=o?'#141414':'#F2F2F2'}" stroke="#C6F432" stroke-width="1.2" rx="1"/>`; });
  if (pl && pl.valid && opts.plan !== false){
    [[pl.target,'TARGET','#C6F432'],[pl.entry,'ENTRY','#D0D0D0'],[pl.stop,'STOP','#FF7A59']].forEach(([v,lab,col]) => {
      s += `<line x1="${x0}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="${col}" stroke-dasharray="5 4" stroke-width="1.2"/><text x="${W-padR-4}" y="${y(v)-5}" fill="${col}" font-size="10" font-weight="600" text-anchor="end" font-family="Space Grotesk, sans-serif">${lab} ${px(v)}</text>`; });
  }
  const lab = i => { const d = i < nH ? hist[i][0] : fut[i-nH]; return d; };
  [0, Math.floor(nH/2), nH-1, N-1].forEach(i => s += `<text x="${cx(i)}" y="${H-8}" fill="#A3A3A3" font-size="11" text-anchor="middle" font-family="Space Grotesk, sans-serif">${dateS(lab(i))}</text>`);
  s += `<line id="xh" x1="0" x2="0" y1="${padT}" y2="${H-padB}" stroke="#A3A3A3" stroke-width="1" opacity="0"/><rect id="hit" x="${padL}" y="0" width="${W-padL-padR}" height="${H}" fill="transparent"/></svg>`;
  const id = 'c' + Math.random().toString(36).slice(2);
  setTimeout(() => {
    const root = document.getElementById(id); if (!root) return;
    const svg = root.querySelector('svg'), tip = root.querySelector('.tip'), xh = svg.querySelector('#xh');
    svg.querySelector('#hit').addEventListener('mousemove', ev => {
      const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * W;
      const i = Math.max(0, Math.min(N-1, Math.floor((sx - padL) / xw)));
      xh.setAttribute('x1', cx(i)); xh.setAttribute('x2', cx(i)); xh.setAttribute('opacity', 1);
      let t;
      if (i < nH){ const [d,o,h,l,c,v] = hist[i]; t = `<b>${dateS(d)}</b><br>O ${px(o)}  H ${px(h)}<br>L ${px(l)}  C ${px(c)}<br><span class="muted">vol ${Math.round(v).toLocaleString()}</span>`; }
      else { const k = i - nH, [o,h,l,c] = med[k]; t = `<b class="gold-t">${dateS(fut[k])} · forecast</b><br>median close ${px(c)} <span class="${cls(c/lastC-1)}">${pct(c/lastC-1)}</span><br>likely ${px(B['25'][k])} – ${px(B['75'][k])}<br>wide ${px(B['10'][k])} – ${px(B['90'][k])}`; }
      tip.innerHTML = t; tip.style.opacity = 1;
      const left = (cx(i) / W) * r.width; tip.style.left = Math.min(left + 14, r.width - tip.offsetWidth - 4) + 'px'; tip.style.top = '8px';
    });
    svg.querySelector('#hit').addEventListener('mouseleave', () => { tip.style.opacity = 0; xh.setAttribute('opacity', 0); });
  });
  return `<div class="chart" id="${id}">${s}<div class="tip"></div></div>
    <div class="legend"><span><i style="background:#C6F432"></i>▲ actual up candle</span><span><i style="background:#FF7A59"></i>▼ actual down candle</span><span><i style="background:#C6F432"></i>median forecast</span><span><i style="background:rgba(173,138,54,.5);height:8px"></i>likely (25–75%)</span><span><i style="background:rgba(173,138,54,.25);height:8px"></i>wide (10–90%)</span></div>`;
}

/* ───────── LINE CHART (equity, hit rate) ───────── */
function lineChart(series, opts={}){
  const W = Math.max(340, Math.min(900, (window.innerWidth||900) - 64)), H = opts.h || (W < 600 ? 220 : 260), padL = 8, padR = 58, padT = 12, padB = 24;
  const n = Math.max(...series.map(s => s.data.length)); if (!n) return '<div class="empty">No data yet.</div>';
  let lo = Infinity, hi = -Infinity; series.forEach(s => s.data.forEach(v => { if (v != null){ lo = Math.min(lo, v); hi = Math.max(hi, v); } }));
  if (opts.min != null) lo = Math.min(lo, opts.min); if (opts.max != null) hi = Math.max(hi, opts.max);
  if (hi === lo){ hi += 1; lo -= 1; } const pd = (hi-lo)*.06; lo -= pd; hi += pd;
  const x = i => padL + (W-padL-padR) * (n === 1 ? .5 : i/(n-1)), y = v => padT + (H-padT-padB)*(1-(v-lo)/(hi-lo));
  const fmt = opts.fmt || (v => v.toFixed(2));
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  for (let k=0;k<=4;k++){ const v = lo+(hi-lo)*k/4; s += `<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="#2E2E2E"/><text x="${W-padR+6}" y="${y(v)+4}" fill="#A3A3A3" font-size="11" font-family="Space Grotesk, sans-serif">${fmt(v)}</text>`; }
  if (opts.ref != null) s += `<line x1="${padL}" x2="${W-padR}" y1="${y(opts.ref)}" y2="${y(opts.ref)}" stroke="#A3A3A3" stroke-dasharray="4 4"/>`;
  series.forEach(se => { const pts = se.data.map((v,i)=> v==null?null:`${x(i)},${y(v)}`).filter(Boolean).join(' '); s += `<polyline points="${pts}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`; });
  if (opts.labels){ [0, Math.floor((n-1)/2), n-1].forEach(i => s += `<text x="${x(i)}" y="${H-6}" fill="#A3A3A3" font-size="11" text-anchor="middle" font-family="Space Grotesk, sans-serif">${esc(opts.labels[i]||'')}</text>`); }
  s += `<line class="xh" y1="${padT}" y2="${H-padB}" stroke="#A3A3A3" opacity="0"/><rect class="hit" x="${padL}" y="0" width="${W-padL-padR}" height="${H}" fill="transparent"/></svg>`;
  const id = 'l' + Math.random().toString(36).slice(2);
  setTimeout(() => { const root = document.getElementById(id); if (!root) return; const svg = root.querySelector('svg'), tip = root.querySelector('.tip'), xh = svg.querySelector('.xh');
    svg.querySelector('.hit').addEventListener('mousemove', ev => { const r = svg.getBoundingClientRect(), sx = (ev.clientX-r.left)/r.width*W; const i = Math.max(0, Math.min(n-1, Math.round((sx-padL)/(W-padL-padR)*(n-1))));
      xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('opacity', 1);
      tip.innerHTML = `<b>${esc(opts.labels?.[i]||'#'+(i+1))}</b>` + series.map(se => `<br><span style="color:${se.color}">━</span> ${esc(se.name)}: ${se.data[i]==null?'—':fmt(se.data[i])}`).join('');
      tip.style.opacity = 1; tip.style.left = Math.min(x(i)/W*r.width + 12, r.width - tip.offsetWidth - 4) + 'px'; tip.style.top = '6px'; });
    svg.querySelector('.hit').addEventListener('mouseleave', () => { tip.style.opacity = 0; xh.setAttribute('opacity', 0); }); });
  return `<div class="chart" id="${id}">${s}<div class="tip"></div></div>` + (series.length > 1 ? `<div class="legend">${series.map(se=>`<span><i style="background:${se.color}"></i>${esc(se.name)}</span>`).join('')}</div>` : '');
}

async function viewReport(){

function calibChart(c){
  if (!c || !c.length) return '<div class="empty">Needs graded calls.</div>';
  const W = 420, H = 230, p = 34, x = v => p + (W-2*p)*(v-.5)/.5, y = v => H-p - (H-2*p)*v;
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  [0,.25,.5,.75,1].forEach(v => s += `<line x1="${p}" x2="${W-p}" y1="${y(v)}" y2="${y(v)}" stroke="#2E2E2E"/><text x="${p-6}" y="${y(v)+4}" fill="#A3A3A3" font-size="10" text-anchor="end" font-family="Space Grotesk, sans-serif">${v*100}%</text>`);
  [.5,.6,.7,.8,.9,1].forEach(v => s += `<text x="${x(v)}" y="${H-p+16}" fill="#A3A3A3" font-size="10" text-anchor="middle" font-family="Space Grotesk, sans-serif">${v*100}%</text>`);
  s += `<line x1="${x(.5)}" y1="${y(.5)}" x2="${x(1)}" y2="${y(1)}" stroke="#A3A3A3" stroke-dasharray="4 4"/>`;
  s += `<polyline points="${c.map(b=>`${x(b.predicted)},${y(b.actual)}`).join(' ')}" fill="none" stroke="#F2F2F2" stroke-width="2"/>`;
  c.forEach(b => s += `<circle cx="${x(b.predicted)}" cy="${y(b.actual)}" r="${4+Math.min(6,Math.sqrt(b.n)/2)}" fill="#F2F2F2" stroke="#1E1E1E" stroke-width="2"><title>${b.bucket}% sure → right ${Math.round(b.actual*100)}% (${b.n} calls)</title></circle>`);
  return s + `</svg><div class="legend"><span><i style="background:#F2F2F2"></i>actual hit rate</span><span><i style="background:#A3A3A3"></i>perfectly calibrated</span><span>dot size = number of calls</span></div>`;
}
function barsChart(rows, ref){
  if (!rows.length) return '<div class="empty">Needs graded calls.</div>';
  return rows.map(r => `<div class="hbar" style="grid-template-columns:70px 1fr 90px"><span class="mono sub">${esc(r.label)}</span><div class="track" style="background:#262626;border-radius:3px"><b style="left:0;width:${Math.max(0,Math.min(1,r.v))*100}%;background:${r.v>=ref?'#F2F2F2':'#6B6B6B'}"></b><div class="mid" style="left:${ref*100}%"></div></div><span class="mono" style="text-align:right">${pct0(r.v)} <span class="muted">(${r.n})</span></span></div>`).join('') + `<div class="legend"><span>line = 50% coin flip</span></div>`;
}

function candleChart(id, ch){
  const el = document.getElementById(id); if (!el || !ch) return;

  if (!window.LightweightCharts){ el.innerHTML = '<div class="empty">The chart library did not load. Refresh to retry.</div>'; return; }
  el.innerHTML = '';
  const day = s => String(s).slice(0,10), seen = new Set();
  const hist = ch.history.filter(r => { const d = day(r[0]); if (seen.has(d)) return false; seen.add(d); return true; });
  const chart = LightweightCharts.createChart(el, {height: el.clientHeight || 360, layout:{background:{color:'transparent'}, textColor:C.ink2, fontFamily:"'Space Grotesk', system-ui, sans-serif", fontSize:12},

  else { main = chart.addAreaSeries({lineColor:C.ink, lineWidth:2, topColor:'rgba(242,242,242,.22)', bottomColor:'rgba(242,242,242,0)'}); main.setData(hist.map(r => ({time:day(r[0]), value:r[4]}))); }
  if (CHART.type !== 'bar'){ const vol = chart.addHistogramSeries({priceFormat:{type:'volume'}, priceScaleId:'vol', lastValueVisible:false, priceLineVisible:false});
    chart.priceScale('vol').applyOptions({scaleMargins:{top:0.84, bottom:0}});
    vol.setData(hist.map(r => ({time:day(r[0]), value:r[5]||0, color:r[4]>=r[1]?'rgba(198,244,50,.3)':'rgba(255,122,89,.3)'}))); }
  const last = hist[hist.length-1], fut = (ch.future||[]).map(day).filter(d => !seen.has(d));
  const line = (vals, color, width, style) => { if (!vals || !fut.length) return; const s = chart.addLineSeries({color, lineWidth:width, lineStyle:style||0, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false});
    s.setData([{time:day(last[0]), value:last[4]}].concat(fut.map((d,i) => ({time:d, value:vals[i]})).filter(p => p.value != null))); };
  const B = ch.bands || {};
  line(B['90'], 'rgba(242,242,242,.5)', 1, 2); line(B['10'], 'rgba(242,242,242,.5)', 1, 2); line(B['50'], C.ink, 2);
  const n = CHART.range || hist.length;
  chart.timeScale().setVisibleLogicalRange({from: Math.max(0, hist.length - n), to: hist.length + fut.length + 1});
  const byDay = new Map(hist.map((r,i) => [day(r[0]), i])), lg = document.getElementById('lwcLegend');
  const show = i => { if (!lg) return; const r = hist[i], p = hist[Math.max(0,i-1)], c = (r[4]/p[4]-1);
    lg.innerHTML = `${day(r[0])} &nbsp; open <b>${px(r[1])}</b> &nbsp; high <b>${px(r[2])}</b> &nbsp; low <b>${px(r[3])}</b> &nbsp; close <b>${px(r[4])}</b> &nbsp; <b class="${cls(c)}">${pct(c,2)}</b>`; };
  show(hist.length-1);
  chart.subscribeCrosshairMove(p => { const i = p && p.time != null ? byDay.get(typeof p.time === 'string' ? p.time : `${p.time.year}-${String(p.time.month).padStart(2,'0')}-${String(p.time.day).padStart(2,'0')}`) : undefined; show(i === undefined ? hist.length-1 : i); });
  new ResizeObserver(() => chart.applyOptions({width: el.clientWidth})).observe(el);
  const wire = (sel, key, num) => { const s = document.querySelector(sel); if (!s) return; s.querySelectorAll('button').forEach(b => { b.classList.toggle('on', String(CHART[key]) === b.dataset.v); b.onclick = () => { CHART[key] = num ? +b.dataset.v : b.dataset.v; candleChart(CHART.id, CHART.src); }; }); };

function regimeHTML(G){
  if (!G || !G.now) return '';
  return `<div class="sec-title">What kind of market this is<small>${dateS(G.first)} to now. The row for today is highlighted.</small></div><div class="card"><p style="margin:0 0 12px;font-size:16px;line-height:1.5">${esc(G.text)} ${esc(G.note)}</p>${G.rows.map(r => `<div class="idea" style="${r.name===G.now?'background:rgba(198,244,50,.08);margin:0 -12px;padding:12px;border-radius:14px':''}"><span><b>${esc(r.name)}</b><small style="display:block;color:var(--muted);line-height:1.4">${esc(r.rule)} ${pct0(r.share)} of days. Did best over the next month: ${r.worked.slice(0,2).map(w => esc(w.name.toLowerCase()) + ' ' + sgn(w.month)).join(', ')}.</small></span><span style="text-align:right"><span class="big ${cls(r.d63.avg)}">${sgn(r.d63.avg)}</span><small style="display:block;color:var(--muted);white-space:nowrap">3 months later<br>up ${pct0(r.d63.up)}</small></span></div>`).join('')}<div class="sub" style="margin-top:10px">${esc(G.caveat)}</div></div>`;
}

async function viewSetup(){
  $('#view').innerHTML = `<div class="grid g2"><div class="card"><h3>Go-live checklist</h3><ol class="steps">
    <li><b>Turn on Actions.</b> GitHub → your kronos repo → <b>Actions</b> tab → “I understand my workflows, enable them”.</li>
    <li><b>Telegram bot.</b> In Telegram message <code>@BotFather</code> → /newbot → copy the token. Message your new bot once, then open <code>api.telegram.org/bot&lt;TOKEN&gt;/getUpdates</code> to find your chat id.</li>
    <li><b>Add secrets.</b> Repo → Settings → Secrets and variables → Actions → New secret: <code>TELEGRAM_BOT_TOKEN</code>, <code>TELEGRAM_CHAT_ID</code>, and optionally <code>PORTFOLIO_HOLDINGS</code> (e.g. <code>AAPL:10,MSFT:5</code>).</li>
    <li><b>First run.</b> Actions → “Daily scan (after the close)” → Run workflow. ~45–70 min the first time.</li>
    <li><b>Optional:</b> <code>ALPACA_KEY_ID</code> + <code>ALPACA_SECRET_KEY</code> (free paper account at alpaca.markets) for auto-trading and a backup price feed. <code>HF_TOKEN</code> + <code>HF_USER</code> for monthly custom models.</li></ol></div>
    <div class="card"><h3>Account</h3><p class="sub">Signed in as <b id="who"></b>. Forecast files live in your private Supabase table and refresh after every scheduled job.</p>
    <h3 style="margin-top:20px">Schedule (Eastern)</h3><div class="sub" style="line-height:1.9">Daily scan · ~5:15 PM (4:15 in winter) weekdays<br>Pre-market briefing · ~8:40 AM (7:40 in winter)<br>S&P 500 scanner · ~3 AM<br>Crypto board · every 2 hours<br>Data vault capture · ~6:40 PM (5:40 in winter)<br>Bot + price alerts · every ~10 min<br>Custom-model retrain · 2nd of each month</div></div></div>`;
  const V = await get('vault.json');
  const vh = V ? `<div class="card" style="margin-top:14px"><h3>Data vault <span class="r">${V.days} day${V.days===1?'':'s'} captured · ${V.size_mb} MB</span></h3>
    <div class="sub" style="margin-bottom:10px">Daily point-in-time snapshots since ${esc(V.first)} — last ${esc(V.last)}. This history is what the Edge Lab will test signals on.</div>
    <div class="kv">${Object.entries(V.latest.files||{}).map(([k,n])=>`<div><span>${esc(k.replace(/_/g,' '))}</span><b>${Number(n).toLocaleString()}</b></div>`).join('')}
    ${Object.entries(V.latest.alpha_vantage||{}).filter(([k])=>k!=='skipped').map(([k,n])=>`<div><span>AV ${esc(k.replace(/_/g,' '))}</span><b>${esc(n)}</b></div>`).join('')}</div>
    ${V.latest.alpha_vantage?.skipped?`<div class="sub" style="margin-top:8px">Alpha Vantage: ${esc(V.latest.alpha_vantage.skipped)}</div>`:''}</div>` : '';
  $('#view').insertAdjacentHTML('beforeend', vh);
  const { data: u } = await sb.auth.getUser(); $('#who').textContent = u?.user?.email || '';
}

async function route(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')) || 'brief';
  if (h.startsWith('t/')){ navRender(h.slice(2).toUpperCase()); try { await viewTicker(h.slice(2).toUpperCase()); } catch(e){ $('#view').innerHTML = `<span class="back" onclick="history.back()">Back</span><div class="empty">Couldn't show this ticker: ${esc(e.message)}</div>`; } window.scrollTo(0,0); return; }
  navRender(h); ecClear();
  const fn = {calendar:viewCalendar, insiders:viewInsiders, earn:viewEarn, brief:viewBrief, fear:viewFear, spx:viewSpx, league:viewLeague, today:viewToday, watch:viewWatch, market:viewMarket, scanner:viewScanner, other:viewOther, report:viewReport, research:viewResearch, mscan:viewMarketScan, live:viewLive, livenews:viewLiveNews, news:viewNews, wsb:viewWSB, filings:viewFilings, term:viewTerminal, lenses:viewLenses, edge:viewEdge, factor:viewFactor, crypto:viewCrypto, perf:viewPerf, backtest:viewBacktest, paper:viewPaper, journal:viewJournal, setup:viewSetup}[h] || viewBrief;
  try { await fn(); } catch(e){ $('#view').innerHTML = `<div class="empty">Couldn't render this view: ${esc(e.message)}</div>`; }
}
let GATED = false;
async function gate(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ location.replace('./#signin'); return false; }
  const { data: ok } = await sb.rpc('oracle_is_member');
  if (!ok){
    $('#nav').innerHTML = '';
    $('#view').innerHTML = `<div class="card" style="max-width:520px;margin:40px auto;text-align:center"><h3>No access yet</h3><p class="sub" style="font-size:14px">${esc(session.user.email)} is signed in but isn't on the Kronos Oracle member list.</p><button class="btn gold" onclick="sb.auth.signOut().then(()=>location.replace('./'))">Sign out</button></div>`;
    return false;
  }
  return true;
}
async function boot(){
  if (!GATED){ if (!(await gate())) return; GATED = true; }
  LATEST = await get('latest.json');
  if (LATEST){
    $('#stamp').innerHTML = 'Forecasts updated <b>' + ago(LATEST.generated) + '</b>';
    const m = LATEST.mood || {}; $('#moodPill').innerHTML = 'Forecast lean <b>' + esc((m.label||'—').toLowerCase()) + '</b>, ' + pct0(m.pct_up) + ' up';
    const r = LATEST.report || {}; $('#hitPill').innerHTML = 'Calls right <b>' + (r.hit_rate!=null ? pct0(r.hit_rate) : '—') + '</b>' + (r.n ? ' of ' + r.n.toLocaleString() : '');
  } else { $('#stamp').textContent = 'waiting for first scan'; }
  route();
}
window.addEventListener('hashchange', route);
navInit();
$('#reload').onclick = () => { for (const k in cache) delete cache[k]; boot(); };
$('#signout').onclick = async () => { await sb.auth.signOut(); location.replace('./'); };
sb.auth.onAuthStateChange((ev) => {
  if (ev === 'SIGNED_OUT') location.replace('./');
  if (ev === 'PASSWORD_RECOVERY'){
    $('#view').innerHTML = `<div class="card" style="max-width:440px;margin:40px auto"><h3>Set a new password</h3><input class="f" id="np" type="password" autocomplete="new-password" placeholder="New password (8+ characters)"><button class="btn gold" id="npSave" style="margin-top:12px;width:100%">Save password</button><div class="sub" id="npMsg" style="margin-top:10px"></div></div>`;
    $('#npSave').onclick = async () => {
      const v = $('#np').value; if (v.length < 8){ $('#npMsg').textContent = 'Use at least 8 characters.'; return; }
      const { error } = await sb.auth.updateUser({ password: v });
      $('#npMsg').textContent = error ? error.message : 'Saved. Loading your dashboard…';
      if (!error) setTimeout(() => { history.replaceState(null, '', 'app.html'); boot(); }, 800);
    };
  }
});
boot();
</script>
