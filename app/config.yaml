# ─────────────────────────────────────────────────────────────
#  KRONOS ORACLE — settings
#  Edit this file on GitHub (pencil icon) to change what gets scanned.
# ─────────────────────────────────────────────────────────────

model:
  # Main model used for your watchlist, indices, sectors, crypto, forex
  name: NeoQuasar/Kronos-small
  tokenizer: NeoQuasar/Kronos-Tokenizer-base
  max_context: 512
  # Model for the overnight S&P 500 scan. The Oct 2026 bake-off (state/diag_bt.json) showed
  # mini leaning bearish, so the scanner uses small too (~10 min for 500 stocks).
  scanner_name: NeoQuasar/Kronos-small
  scanner_tokenizer: NeoQuasar/Kronos-Tokenizer-base
  scanner_max_context: 512
  # Models raced against each other in "Model Battle"
  battle:
    - {name: NeoQuasar/Kronos-mini,  tokenizer: NeoQuasar/Kronos-Tokenizer-2k,   max_context: 2048}
    - {name: NeoQuasar/Kronos-small, tokenizer: NeoQuasar/Kronos-Tokenizer-base, max_context: 512}
    - {name: NeoQuasar/Kronos-base,  tokenizer: NeoQuasar/Kronos-Tokenizer-base, max_context: 512}
  # Fine-tuned per-ticker models are written to app/custom_models.yaml by the monthly retrain

forecast:
  lookback: 120          # candles of history fed to Kronos. 400 made forecasts snap back toward the
                         # long-run average (AMD -60% in a week); 120 had the least bias in backtests
  horizon: 5             # trading days ahead (daily timeframe)
  samples: 30            # simulated futures per stock (agreement meter = X / samples)
  temperature: 1.0
  top_p: 0.9
  batch_size: 64         # sequences per model call (lower if memory runs out)
  hourly_horizon: 7      # 1h bars (~1 trading day)
  weekly_horizon: 4      # 1wk bars (~1 month) -> monthly range + weekly timeframe
  crypto_hourly_horizon: 24

# Your main list — full detail, trade plans, multi-timeframe, alerts
watchlist: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, AMD, AVGO, NFLX, JPM, COIN, PLTR, SMCI, UBER]

# Your real holdings live in the PORTFOLIO_HOLDINGS secret (e.g. "AAPL:10,MSFT:5"),
# never in this public file.

indices: [SPY, QQQ, DIA, IWM]
vix: ^VIX

sectors:
  XLK: Technology
  XLF: Financials
  XLE: Energy
  XLV: Health Care
  XLY: Consumer Discretionary
  XLP: Consumer Staples
  XLI: Industrials
  XLB: Materials
  XLU: Utilities
  XLRE: Real Estate
  XLC: Communication

leveraged: [TQQQ, SQQQ, SOXL, SOXS, UPRO, SPXU, TNA, TZA, LABU, FAS]

crypto: [BTC-USD, ETH-USD, SOL-USD, XRP-USD, BNB-USD, DOGE-USD, ADA-USD, TRX-USD, AVAX-USD, LINK-USD,
         DOT-USD, LTC-USD, BCH-USD, XLM-USD, HBAR-USD, SHIB-USD, UNI-USD, NEAR-USD, ATOM-USD, ETC-USD]

forex:
  EURUSD=X: EUR/USD
  GBPUSD=X: GBP/USD
  USDJPY=X: USD/JPY
  AUDUSD=X: AUD/USD
  USDCAD=X: USD/CAD
  USDCHF=X: USD/CHF
  NZDUSD=X: NZD/USD

commodities:
  GC=F: Gold
  SI=F: Silver
  CL=F: Crude Oil
  NG=F: Natural Gas
  HG=F: Copper

data:
  # Yahoo Finance is the main free price feed.
  # Alpha Vantage (secret ALPHAVANTAGE_API_KEY): FREE key -> earnings dates for every stock in one call/day.
  #   Free keys only return 100 days of prices (Kronos wants ~400), so prices stay on Yahoo.
  # PAID key: also add secret ALPHAVANTAGE_PREMIUM=true, then list tickers here (or "all")
  #   to pull split-adjusted prices from Alpha Vantage first, with Yahoo as the backup.
  #   Calls are spaced to stay under the plan's per-minute cap: 66/min by default
  #   (headroom under the $49.99 plan's 75). Change it with repo variable/secret AV_CALLS_PER_MIN.
  #   Whole S&P 500 = ~500 calls = ~8 min at 66/min. Same ticker twice in one run = one call.
  alphavantage_first: []

scanner:
  sp500: true            # overnight scan of the whole S&P 500 with the mini model
  samples: 12

filters:
  min_price: 3.0                  # below this = penny stock, hidden from top lists
  min_avg_dollar_volume: 5000000  # 20-day average $ volume

signals:
  alert_min_score: 75
  alert_min_agreement: 0.75
  min_rr: 2.0                     # trade plans need reward >= 2x risk
  breakout_lookback: 20
  volatility_warn_ratio: 1.6      # predicted swings vs normal swings
  volume_surge_ratio: 1.5
  earnings_pause: true            # pause signals when earnings land inside the forecast window

risk:
  account_size: 10000
  risk_per_trade: 0.01            # 1% of account risked per trade

paper:
  starting_cash: 100000
  max_positions: 10
  position_pct: 0.10
  allow_short: false

autotrade:
  enabled: false                  # flip to true to send orders to Alpaca
  live: false                     # false = Alpaca PAPER account. Live also needs secret ALPACA_LIVE_CONFIRM=YES
  min_hit_rate: 0.58              # report card must earn it before live trading is allowed
  min_graded: 100
  max_positions: 5
  position_pct: 0.10

backtest:
  days: 250
  step: 5
  threshold: 0.65                 # agreement needed to take a trade
  cost_bps: 5                     # commission + slippage per side
  samples: 16

hedge:
  trigger_return: -0.02           # suggest a hedge if portfolio is predicted to drop 2%+
  trigger_prob: 0.65
  ratio: 0.5

ensemble:
  rsi_period: 14

retrain:
  tickers: [AAPL, NVDA, TSLA]     # custom models trained monthly (needs HF_TOKEN + HF_USER secrets)
  epochs: 3
  learning_rate: 0.000002

capture:
  # DATA VAULT — daily snapshot saved to data/daily/YYYY-MM-DD/ (python -m app.cli capture)
  fundamentals_all: true     # fundamentals + short interest + analyst snapshot for every S&P 500 stock
  backfill: true             # one-time 10-year daily price history for every ticker -> data/history/
  av_daily_limit: 25         # Alpha Vantage free key allowance
  av_reserve: 3              # calls left unused for the daily scan's earnings lookup

supabase:
  # Private dashboard behind login. Public values (safe to commit): project URL + publishable key.
  # Writes need the GitHub secret ORACLE_SYNC_TOKEN; reads need a signed-in, allow-listed email.
  url: https://stzeugbijanjwroibtmx.supabase.co
  anon_key: sb_publishable_IsJeraZpjoUXbeO8Lr-F_g_14h7UoUm

research:
  # AI research ratings (TradingAgents). Needs one AI key secret; GOOGLE_API_KEY (Gemini) has a free tier.
  per_run: 15             # the whole watchlist each night (about 300 AI calls, inside the free allowance)
  holding_days: 5         # trading days until a rating is graded against SPY
  debate_rounds: 1        # bull vs bear rounds (more = deeper, more AI calls)
  risk_rounds: 1
  pause_seconds: 20       # wait between stocks to stay under per-minute limits
  # provider: google      # force one provider; default = first key found
  # quick_model: gemini-3.5-flash-lite
  # Google's free plan allows only 20 calls a day on gemini-3.8-flash and one stock needs more than that,
  # so both roles use the lite model, which has a much larger free allowance.
  deep_model: gemini-3.5-flash-lite

tickerbot:
  # Market-wide scans (Tickerbot, secret TICKERBOT_API_KEY). q is a SQL-style WHERE over signal names;
  # the full list of names is saved to state/tickerbot_signals.json after the first run.
  scans:
    - name: Oversold with heavy volume
      why: Sharp selloffs on big volume in large companies sometimes mark capitulation and a bounce.
      q: "rsi_14 < 30 AND relative_volume > 2 AND market_cap > 2000000000"
      order: volume_ratio_20d
    - name: Gap ups on volume
      why: A stock opening well above yesterday's close on high volume usually has fresh news behind it.
      q: "gap_up AND relative_volume > 2 AND market_cap > 1000000000"
      order: gap_pct
    - name: Biggest movers today (large caps)
      why: The day's largest moves among big companies. Start here to study what is driving the market.
      q: "market_cap > 10000000000 AND asset_class = 'stocks'"
      order: change_1d_pct
      limit: 15
    - name: Unusual volume
      why: Trading several times normal volume means big players are active, in either direction.
      q: "relative_volume > 3 AND market_cap > 2000000000"
      order: relative_volume

quotes:
  # Live price board (job "Live prices"). Every run a different source leads, the rest fill gaps,
  # so no free limit runs out. Calls allowed per source per day:
  daily_caps:
    yahoo: 1500          # no key needed
    finnhub: 3000        # free plan allows 60 a minute
    tickerbot: 40        # one call covers the whole list; raise if your plan allows more
    alpaca: 2000         # one call covers the whole list
    alphavantage: 3      # free key is 25 a day and the data vault uses most of them

news:
  # News desk (job "News desk"). Headlines per stock and how many days back to look.
  per_ticker: 12
  max_age_days: 3

filings:
  # Filings Lab (SEC EDGAR, free). SEC requires automated visitors to give a name and real contact email.
  # Example:  contact: "Lucky Smith lucky@example.com"
  contact: "Ishmam Hossain takaxkoi@gmail.com"
